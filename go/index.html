        const data = { value }

        }

        localStorage.setItem(key, JSON.stringify(data))
      },
      get: key => {
        const itemStr = localStorage.getItem(key)
        if (!itemStr) return

        try {
          const data = JSON.parse(itemStr)

          if (data.expiry && Date.now() > data.expiry) {
            localStorage.removeItem(key)
            return
          }

          return data.value
        } catch {
          localStorage.removeItem(key)
        }
      }
    }

        if (scriptCache.has(url)) {
          return scriptCache.get(url)
        }

        const promise = new Promise((resolve, reject) => {
          const script = document.createElement('script')

          script.src = url
          script.async = true

          for (const key in attr) {
            script.setAttribute(key, attr[key])
          }

          script.onload = resolve
          script.onerror = reject

          document.head.appendChild(script)
        })

        scriptCache.set(url, promise)

        return promise
      },
      getCSS: (url, id) => {
        if (cssCache.has(url)) {
          return cssCache.get(url)
        }

        const promise = new Promise((resolve, reject) => {
          const link = document.createElement('link')

          link.rel = 'stylesheet'
          link.href = url

          if (id) {
            link.id = id
          }

          link.onload = resolve
          link.onerror = reject

          document.head.appendChild(link)
        })

        cssCache.set(url, promise)

        return promise

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var target = params.get('url');

    if (!target || !/^https?:\/\/.+/.test(target)) {
      var card = document.querySelector('.go-card');
      card.innerHTML = '<div class="go-error">' +
        '<div class="error-icon"></div>' +
        '<h2>无效链接</h2>' +
        '<p>缺少或包含非法参数的跳转请求</p>' +
        '</div>';
      return;
    }

    var btn = document.getElementById('targetLink');
    var timerEl = document.getElementById('timer');
    btn.href = target;

    var seconds = 3;
    var interval = setInterval(function() {
      seconds--;
      timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = target;
      }
    }, 1000);

    btn.addEventListener('click', function() {
      clearInterval(interval);
    });
  })();
</script>
